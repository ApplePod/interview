<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>면접 일정 예약 | 뉴런소프트</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="wrap">
    <div class="brand"><span class="brand-mark">N</span>뉴런소프트</div>

    <div id="bookingView">
      <div class="firework-field" aria-hidden="true" id="miniFireworkField"></div>

      <div class="hero-team" id="heroTeam" role="group" aria-label="면접관 선택">
        <div class="hero-avatar" style="--i:0" data-key="dochi" role="button" tabindex="0"><img src="assets/team/dochi.png" alt="도치" /><span class="hero-avatar-name">도치</span></div>
        <div class="hero-avatar" style="--i:1" data-key="malti" role="button" tabindex="0"><img src="assets/team/malti.png" alt="말티" /><span class="hero-avatar-name">말티</span></div>
        <div class="hero-avatar hero-avatar--mid" style="--i:2" data-key="soho" role="button" tabindex="0"><img src="assets/team/soho.png" alt="소호" /><span class="hero-avatar-name">소호</span></div>
        <div class="hero-avatar" style="--i:3" data-key="jay" role="button" tabindex="0"><img src="assets/team/jay.png" alt="제이" /><span class="hero-avatar-name">제이</span></div>
        <div class="hero-avatar" style="--i:4" data-key="noah" role="button" tabindex="0"><img src="assets/team/noah.png" alt="노아" /><span class="hero-avatar-name">노아</span></div>
      </div>
      <p class="hero-caption" id="heroCaption">누구와 면접하고 싶으세요? 위에서 한 분을 골라주세요 👋</p>

      <h1 class="page-title" id="pageTitle">먼저 면접관을 선택해주세요</h1>
      <p class="page-desc" id="pageDesc">팀원을 고르면 그 분의 예약 가능한 일정이 나와요.</p>

      <div class="steps" id="steps" style="display:none;">
        <div class="step" id="step0"><div class="step-dot">1</div><div class="step-label">담당자</div></div>
        <div class="step-line"></div>
        <div class="step" id="step1"><div class="step-dot">2</div><div class="step-label">날짜</div></div>
        <div class="step-line"></div>
        <div class="step" id="step2"><div class="step-dot">3</div><div class="step-label">시간</div></div>
        <div class="step-line"></div>
        <div class="step" id="step3"><div class="step-dot">4</div><div class="step-label">정보</div></div>
      </div>

      <div class="calendar" id="calendar" style="display:none;">
        <div class="cal-header">
          <button class="cal-nav-btn" id="calPrev" type="button" aria-label="이전 달">‹</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="cal-nav-btn" id="calNext" type="button" aria-label="다음 달">›</button>
        </div>
        <div class="cal-weekdays">
          <div class="cal-weekday">일</div><div class="cal-weekday">월</div><div class="cal-weekday">화</div><div class="cal-weekday">수</div><div class="cal-weekday">목</div><div class="cal-weekday">금</div><div class="cal-weekday">토</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div id="slotsContainer"></div>

      <div class="card" id="formCard" style="display:none;">
        <div class="field">
          <label for="c-name">이름 *</label>
          <input type="text" id="c-name" required />
        </div>
        <div class="field">
          <label for="c-email">이메일 *</label>
          <input type="email" id="c-email" required />
        </div>
        <div class="field">
          <label for="c-phone">연락처</label>
          <input type="tel" id="c-phone" />
        </div>
        <div class="field">
          <label for="c-position">지원 포지션</label>
          <input type="text" id="c-position" placeholder="예: PO, 개발자" />
        </div>
        <div class="field">
          <label for="c-salary">희망연봉 (편하게 기입) *</label>
          <input type="text" id="c-salary" placeholder="예: 4000만원, 협의 가능" required />
        </div>
        <div class="field">
          <label for="c-resume">이력서 최신본 * <span class="field-hint">PDF·DOC 등, 10MB 이하</span></label>
          <input type="file" id="c-resume" accept=".pdf,.doc,.docx,.hwp" required />
        </div>
        <div class="field">
          <label for="c-portfolio">포트폴리오 <span class="field-hint">선택, 10MB 이하</span></label>
          <input type="file" id="c-portfolio" accept=".pdf,.doc,.docx,.ppt,.pptx,.hwp" />
        </div>
        <button class="btn btn-primary" id="confirmBtn">이 시간으로 예약하기</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>

    <div id="successView" style="display:none;">
      <div class="firework-field" aria-hidden="true" id="fireworkField"></div>

      <div class="welcome-team" aria-hidden="true">
        <div class="welcome-avatar" style="--i:0">
          <img src="assets/team/dochi.png" alt="" />
          <span class="welcome-avatar-name">도치</span>
        </div>
        <div class="welcome-avatar" style="--i:1">
          <img src="assets/team/malti.png" alt="" />
          <span class="welcome-avatar-name">말티</span>
        </div>
        <div class="welcome-avatar welcome-avatar--center" style="--i:2">
          <img src="assets/team/soho.png" alt="" />
          <span class="welcome-avatar-name">소호</span>
        </div>
        <div class="welcome-avatar" style="--i:3">
          <img src="assets/team/jay.png" alt="" />
          <span class="welcome-avatar-name">제이</span>
        </div>
        <div class="welcome-avatar" style="--i:4">
          <img src="assets/team/noah.png" alt="" />
          <span class="welcome-avatar-name">노아</span>
        </div>
      </div>

      <div class="success-box card">
        <div class="success-icon">✓</div>
        <div class="success-title">예약이 완료되었습니다</div>
        <div class="success-desc" id="successDesc"></div>
        <div class="success-actions">
          <button class="btn btn-ghost" id="icsBtn" type="button">📅 캘린더에 추가하기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://lnvaqdfhsewihveemhbm.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_4X1V0pGecymEpwcSduQjTw_ZCkZTrhK';
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    var TEAM = [
      { key: 'dochi', name: '도치' },
      { key: 'malti', name: '말티' },
      { key: 'soho', name: '소호' },
      { key: 'jay', name: '제이' },
      { key: 'noah', name: '노아' }
    ];

    var selectedSlotId = null;
    var slotsById = {};
    var slotsByDate = {};
    var calMonth = null;
    var selectedDate = null;
    var typeTimer = null;
    var lastBookedSlot = null;
    var selectedInterviewer = null;
    var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function guideName() {
      var t = TEAM.find(function (t) { return t.key === selectedInterviewer; });
      return t ? t.name : '';
    }

    function chooseInterviewer(key) {
      selectedInterviewer = key;
      selectedDate = null;
      selectedSlotId = null;
      calMonth = null;
      document.querySelectorAll('#heroTeam .hero-avatar').forEach(function (el) {
        el.classList.toggle('is-guide', el.getAttribute('data-key') === key);
      });
      document.getElementById('pageTitle').textContent = guideName() + '님과의 면접 일정을 선택해주세요';
      document.getElementById('pageDesc').textContent = '달력에서 초록 점이 있는 날짜를 고르면, 그 날 예약 가능한 시간이 나와요.';
      document.getElementById('formCard').style.display = 'none';
      loadSlots();
    }

    document.querySelectorAll('#heroTeam .hero-avatar').forEach(function (el) {
      el.addEventListener('click', function () { chooseInterviewer(el.getAttribute('data-key')); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chooseInterviewer(el.getAttribute('data-key')); }
      });
    });

    // 취소 후 "다른 시간으로 다시 예약하기" 링크로 들어오면 담당자를 미리 선택해둔다.
    (function preselectFromQuery() {
      var params = new URLSearchParams(window.location.search);
      var key = params.get('interviewer');
      if (key && TEAM.some(function (t) { return t.key === key; })) {
        chooseInterviewer(key);
      }
    })();

    function typeText(text) {
      var el = document.getElementById('heroCaption');
      if (typeTimer) clearInterval(typeTimer);
      if (prefersReduced) { el.textContent = text; return; }
      el.textContent = '';
      var i = 0;
      typeTimer = setInterval(function () {
        i++;
        el.textContent = text.slice(0, i);
        if (i >= text.length) clearInterval(typeTimer);
      }, 16);
    }

    function updateGuideMessage(state) {
      var msg;
      if (state === 'loading-error') {
        msg = '앗, 일정을 불러오지 못했어요. 새로고침 해볼까요? 🙏';
      } else if (state === 'empty') {
        msg = '지금은 예약 가능한 시간이 없어요. 조금만 기다려주세요 🙏';
      } else if (!selectedDate) {
        msg = guideName() + '예요! 편한 날짜부터 골라주세요 👋';
      } else if (!selectedSlotId) {
        msg = '좋아요! 이제 편한 시간을 골라주세요 ⏰';
      } else {
        msg = '거의 다 왔어요! 이름과 이메일만 알려주시면 끝이에요 ✍️';
      }
      typeText(msg);
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function toKey(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
    function todayKey() { var t = new Date(); return toKey(t.getFullYear(), t.getMonth(), t.getDate()); }
    function fmtTime(t) { return t.slice(0, 5); }
    function fmtDate(d) {
      var dt = new Date(d + 'T00:00:00');
      return (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + WEEKDAYS[dt.getDay()] + ')';
    }

    function updateSteps() {
      var s0 = document.getElementById('step0');
      var s1 = document.getElementById('step1');
      var s2 = document.getElementById('step2');
      var s3 = document.getElementById('step3');
      [s0, s1, s2, s3].forEach(function (s) { s.classList.remove('is-active', 'is-done'); });
      s0.classList.add('is-done');
      if (!selectedDate) {
        s1.classList.add('is-active');
      } else if (!selectedSlotId) {
        s1.classList.add('is-done');
        s2.classList.add('is-active');
      } else {
        s1.classList.add('is-done');
        s2.classList.add('is-done');
        s3.classList.add('is-active');
      }
    }

    async function loadSlots() {
      if (!selectedInterviewer) return;
      var { data, error } = await sb
        .from('interview_slots')
        .select('*')
        .eq('is_booked', false)
        .eq('interviewer', selectedInterviewer)
        .order('slot_date', { ascending: true })
        .order('start_time', { ascending: true });

      slotsById = {};
      slotsByDate = {};
      if (!error && data) {
        data.forEach(function (slot) {
          slotsById[slot.id] = slot;
          if (!slotsByDate[slot.slot_date]) slotsByDate[slot.slot_date] = [];
          slotsByDate[slot.slot_date].push(slot);
        });
      }

      var hasAnySlots = Object.keys(slotsByDate).length > 0;
      var calendarEl = document.getElementById('calendar');

      if (error) {
        calendarEl.style.display = 'none';
        document.getElementById('steps').style.display = 'none';
        document.getElementById('slotsContainer').innerHTML = '<p class="empty-state">일정을 불러오지 못했어요. 새로고침 해주세요.</p>';
        updateGuideMessage('loading-error');
        return;
      }
      if (!hasAnySlots) {
        calendarEl.style.display = 'none';
        document.getElementById('steps').style.display = 'none';
        document.getElementById('slotsContainer').innerHTML = '<p class="empty-state">지금은 예약 가능한 시간이 없어요. 담당자에게 문의해주세요.</p>';
        updateGuideMessage('empty');
        return;
      }

      calendarEl.style.display = 'block';
      document.getElementById('steps').style.display = 'flex';

      if (!calMonth) {
        var firstDateKey = Object.keys(slotsByDate).sort()[0];
        var fd = new Date(firstDateKey + 'T00:00:00');
        calMonth = new Date(fd.getFullYear(), fd.getMonth(), 1);
      }
      if (selectedDate && !slotsByDate[selectedDate]) {
        selectedDate = null;
        selectedSlotId = null;
        document.getElementById('formCard').style.display = 'none';
      }

      renderCalendar();
      renderDaySlots();
      updateSteps();
      updateGuideMessage();
    }

    function renderCalendar() {
      var y = calMonth.getFullYear();
      var m = calMonth.getMonth();
      document.getElementById('calTitle').textContent = y + '년 ' + (m + 1) + '월';

      var firstDay = new Date(y, m, 1);
      var startOffset = firstDay.getDay();
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var today = todayKey();

      var html = '';
      for (var i = 0; i < startOffset; i++) {
        html += '<div class="cal-day is-outside"></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var key = toKey(y, m, d);
        var hasSlots = !!slotsByDate[key];
        var isPast = key < today;
        var classes = ['cal-day'];
        if (hasSlots) classes.push('has-slots');
        if (key === today) classes.push('is-today');
        if (key === selectedDate) classes.push('is-selected');
        if (!hasSlots || isPast) classes.push('is-disabled');
        html += '<div class="' + classes.join(' ') + '" data-date="' + key + '">' + d + '</div>';
      }
      document.getElementById('calGrid').innerHTML = html;

      document.querySelectorAll('#calGrid .cal-day.has-slots:not(.is-disabled)').forEach(function (cell) {
        cell.addEventListener('click', function () {
          selectedDate = cell.getAttribute('data-date');
          selectedSlotId = null;
          document.getElementById('formCard').style.display = 'none';
          renderCalendar();
          renderDaySlots();
          updateSteps();
          updateGuideMessage();
        });
      });
    }

    function burstAtElement(el, sparkCount, spread) {
      if (prefersReduced) return;
      var field = document.getElementById('miniFireworkField');
      if (!field || !el) return;
      var rect = el.getBoundingClientRect();
      var xPct = ((rect.left + rect.width / 2) / window.innerWidth) * 100;
      var cyPx = rect.top + rect.height / 2;
      for (var i = 0; i < sparkCount; i++) {
        var angle = (i / sparkCount) * Math.PI * 2 + Math.random() * 0.4;
        var dist = spread * 0.5 + Math.random() * spread;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;
        var s = document.createElement('div');
        s.className = 'firework-spark';
        s.style.left = xPct + '%';
        s.style.top = cyPx.toFixed(0) + 'px';
        s.style.setProperty('--dx', dx.toFixed(0) + 'px');
        s.style.setProperty('--dy', dy.toFixed(0) + 'px');
        field.appendChild(s);
        (function (node) { setTimeout(function () { node.remove(); }, 1500); })(s);
      }
    }

    function renderDaySlots() {
      var container = document.getElementById('slotsContainer');
      if (!selectedDate) {
        container.innerHTML = '<p class="cal-empty-hint">🟢 초록 점이 있는 날짜를 선택해주세요.</p>';
        return;
      }
      var slots = slotsByDate[selectedDate] || [];
      if (slots.length === 0) {
        container.innerHTML = '<p class="empty-state">이 날짜엔 예약 가능한 시간이 없어요.</p>';
        return;
      }
      var html = '<div class="slot-date-label">' + fmtDate(selectedDate) + '</div><div class="slot-list">';
      slots.forEach(function (slot) {
        html += '<button type="button" class="slot-btn' + (slot.id === selectedSlotId ? ' is-selected' : '') + '" data-id="' + slot.id + '">' + fmtTime(slot.start_time) + ' – ' + fmtTime(slot.end_time) + '</button>';
      });
      html += '</div>';
      container.innerHTML = html;

      container.querySelectorAll('.slot-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          container.querySelectorAll('.slot-btn').forEach(function (b) { b.classList.remove('is-selected'); });
          btn.classList.add('is-selected');
          selectedSlotId = btn.getAttribute('data-id');
          burstAtElement(btn, 16, 42);
          document.getElementById('formCard').style.display = 'block';
          document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
          updateSteps();
          updateGuideMessage();
        });
      });
    }

    document.getElementById('calPrev').addEventListener('click', function () {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
      renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', function () {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    function fireCelebration() {
      var field = document.getElementById('fireworkField');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !field) return;

      function burst(xPct, yPct, delay, sparkCount, spread) {
        var vh = window.innerHeight;
        var cyPx = vh * (yPct / 100);
        for (var i = 0; i < sparkCount; i++) {
          var angle = (i / sparkCount) * Math.PI * 2 + Math.random() * 0.3;
          var dist = spread * 0.6 + Math.random() * spread;
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var el = document.createElement('div');
          el.className = 'firework-spark';
          el.style.left = xPct + '%';
          el.style.top = cyPx.toFixed(0) + 'px';
          el.style.setProperty('--dx', dx.toFixed(0) + 'px');
          el.style.setProperty('--dy', dy.toFixed(0) + 'px');
          el.style.animationDelay = delay + 's';
          field.appendChild(el);
        }
      }

      var bursts = [
        [12, 18], [50, 12], [85, 20],
        [25, 38], [72, 35], [50, 45],
        [10, 60], [90, 58], [35, 68], [65, 65]
      ];
      bursts.forEach(function (pos, idx) {
        var delay = idx * 0.07 + Math.random() * 0.06;
        var sparkCount = 28 + Math.floor(Math.random() * 14);
        var spread = 65 + Math.random() * 70;
        burst(pos[0], pos[1], delay, sparkCount, spread);
      });

      setTimeout(function () {
        bursts.forEach(function (pos, idx) {
          var delay = idx * 0.07;
          burst(
            Math.min(96, Math.max(4, pos[0] + (Math.random() * 16 - 8))),
            Math.min(78, Math.max(8, pos[1] + (Math.random() * 12 - 6))),
            delay, 26 + Math.floor(Math.random() * 12), 60 + Math.random() * 70
          );
        });
      }, 1800);
    }

    var MAX_FILE_BYTES = 10 * 1024 * 1024;

    async function uploadFile(slotId, kind, file) {
      var signResp = await fetch('/api/upload-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slotId: slotId, kind: kind, filename: file.name, size: file.size })
      });
      var signResult = await signResp.json();
      if (!signResp.ok || !signResult.ok) {
        throw new Error((signResult && signResult.error) || '업로드 URL 발급 실패');
      }

      var putResp = await fetch(signResult.uploadUrl, {
        method: 'PUT',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': file.type || 'application/octet-stream'
        },
        body: file
      });
      if (!putResp.ok) {
        throw new Error('파일 업로드 실패');
      }
      return signResult.publicUrl;
    }

    document.getElementById('confirmBtn').addEventListener('click', async function () {
      var statusEl = document.getElementById('statusMsg');
      statusEl.textContent = '';
      statusEl.className = 'status-msg';

      if (!selectedSlotId) {
        statusEl.textContent = '먼저 시간을 선택해주세요.';
        statusEl.classList.add('is-error');
        return;
      }
      var name = document.getElementById('c-name').value.trim();
      var email = document.getElementById('c-email').value.trim();
      var phone = document.getElementById('c-phone').value.trim();
      var position = document.getElementById('c-position').value.trim();
      var salary = document.getElementById('c-salary').value.trim();
      var resumeFile = document.getElementById('c-resume').files[0];
      var portfolioFile = document.getElementById('c-portfolio').files[0];

      if (!name || !email) {
        statusEl.textContent = '이름과 이메일은 필수예요.';
        statusEl.classList.add('is-error');
        return;
      }
      if (!salary) {
        statusEl.textContent = '희망연봉을 입력해주세요.';
        statusEl.classList.add('is-error');
        return;
      }
      if (!resumeFile) {
        statusEl.textContent = '이력서 파일을 첨부해주세요.';
        statusEl.classList.add('is-error');
        return;
      }
      if (resumeFile.size > MAX_FILE_BYTES || (portfolioFile && portfolioFile.size > MAX_FILE_BYTES)) {
        statusEl.textContent = '파일은 10MB 이하로 올려주세요.';
        statusEl.classList.add('is-error');
        return;
      }

      var btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = '업로드 중…';

      var resp, result;
      try {
        var resumeUrl = await uploadFile(selectedSlotId, 'resume', resumeFile);
        var portfolioUrl = portfolioFile ? await uploadFile(selectedSlotId, 'portfolio', portfolioFile) : null;

        btn.textContent = '예약 중…';

        resp = await fetch('/api/book-slot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slotId: selectedSlotId, name: name, email: email, phone: phone, position: position,
            salary: salary, resumeUrl: resumeUrl, portfolioUrl: portfolioUrl
          })
        });
        result = await resp.json();
      } catch (e) {
        resp = null;
        result = null;
      }

      btn.disabled = false;
      btn.textContent = '이 시간으로 예약하기';

      if (!resp || !result || !result.ok) {
        if (result && result.error === 'already_booked') {
          statusEl.textContent = '아쉽게도 방금 다른 분이 먼저 예약했어요. 다른 시간을 선택해주세요.';
          statusEl.classList.add('is-error');
          selectedSlotId = null;
          document.getElementById('formCard').style.display = 'none';
          loadSlots();
          return;
        }
        statusEl.textContent = '오류가 발생했어요. 다시 시도해주세요.';
        statusEl.classList.add('is-error');
        return;
      }

      var slot = slotsById[selectedSlotId];
      lastBookedSlot = slot;
      document.getElementById('successDesc').textContent =
        guideName() + '(이)가 ' + fmtDate(slot.slot_date) + ' ' + fmtTime(slot.start_time) + ' – ' + fmtTime(slot.end_time) + '에 뵙겠습니다. 입력하신 이메일로 별도 안내드릴게요.';
      document.getElementById('bookingView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      fireCelebration();
    });

    function buildIcs(slot) {
      var d = slot.slot_date.replace(/-/g, '');
      var startT = slot.start_time.slice(0, 5).replace(':', '') + '00';
      var endT = slot.end_time.slice(0, 5).replace(':', '') + '00';
      var lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//뉴런소프트//면접 일정//KO',
        'BEGIN:VEVENT',
        'UID:' + slot.id + '@newlearnsoft-interview',
        'DTSTAMP:' + d + 'T' + startT,
        'DTSTART:' + d + 'T' + startT,
        'DTEND:' + d + 'T' + endT,
        'SUMMARY:뉴런소프트 면접 (' + guideName() + ')',
        'DESCRIPTION:뉴런소프트 ' + guideName() + '님과의 면접 일정입니다.',
        'END:VEVENT',
        'END:VCALENDAR'
      ];
      return lines.join('\r\n');
    }

    document.getElementById('icsBtn').addEventListener('click', function () {
      if (!lastBookedSlot) return;
      var ics = buildIcs(lastBookedSlot);
      var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '뉴런소프트_면접일정.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
