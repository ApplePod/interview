<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>면접 일정 관리 | 뉴런소프트</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="wrap">
    <a class="brand" href="/admin.html" aria-label="처음으로"><span class="brand-mark">N</span>뉴런소프트</a>

    <div id="loginView">
      <div class="login-avatar" aria-hidden="true"><img src="assets/team/dochi.png" alt="" /></div>
      <p class="login-greet">수고 많으세요! 오늘도 좋은 분을 만나봐요 :)</p>
      <div class="card login-box">
        <div class="field">
          <label for="a-email">이메일</label>
          <input type="email" id="a-email" autocomplete="username" />
        </div>
        <div class="field">
          <label for="a-password">비밀번호</label>
          <input type="password" id="a-password" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="loginBtn">로그인</button>
        <div class="status-msg" id="loginStatus"></div>
      </div>
    </div>

    <div id="whoView" style="display:none;">
      <div class="login-avatar" aria-hidden="true"><img src="assets/team/dochi.png" alt="" /></div>
      <p class="login-greet">로그인됐어요! 오늘은 누구로 접속하시나요?</p>
      <div class="hero-team" id="whoTeam" role="group" aria-label="담당자 선택">
        <div class="hero-avatar" style="--i:0" data-key="dochi" role="button" tabindex="0"><img src="assets/team/dochi.png" alt="도치" /><span class="hero-avatar-name">도치</span></div>
        <div class="hero-avatar" style="--i:1" data-key="malti" role="button" tabindex="0"><img src="assets/team/malti.png" alt="말티" /><span class="hero-avatar-name">말티</span></div>
        <div class="hero-avatar hero-avatar--mid" style="--i:2" data-key="soho" role="button" tabindex="0"><img src="assets/team/soho.png" alt="소호" /><span class="hero-avatar-name">소호</span></div>
        <div class="hero-avatar" style="--i:3" data-key="jay" role="button" tabindex="0"><img src="assets/team/jay.png" alt="제이" /><span class="hero-avatar-name">제이</span></div>
        <div class="hero-avatar" style="--i:4" data-key="noah" role="button" tabindex="0"><img src="assets/team/noah.png" alt="노아" /><span class="hero-avatar-name">노아</span></div>
      </div>
    </div>

    <div id="adminView" style="display:none;">
      <div class="admin-header">
        <h1 class="page-title" style="margin-bottom:0;">면접 일정 관리 · <span id="whoAmI"></span></h1>
        <div>
          <button class="btn btn-ghost" id="switchWhoBtn">담당자 변경</button>
          <button class="btn btn-ghost" id="logoutBtn">로그아웃</button>
        </div>
      </div>

      <div class="card">
        <div class="field" style="margin-bottom:16px;"><label>새 슬롯 추가 — 날짜를 클릭해주세요 (담당자: <span id="whoAmI2"></span>)</label></div>

        <div class="calendar" id="adminCalendar" style="margin-bottom:16px;">
          <div class="cal-header">
            <button class="cal-nav-btn" id="adminCalPrev" type="button" aria-label="이전 달">‹</button>
            <div class="cal-title" id="adminCalTitle"></div>
            <button class="cal-nav-btn" id="adminCalNext" type="button" aria-label="다음 달">›</button>
          </div>
          <div class="cal-weekdays">
            <div class="cal-weekday">일</div><div class="cal-weekday">월</div><div class="cal-weekday">화</div><div class="cal-weekday">수</div><div class="cal-weekday">목</div><div class="cal-weekday">금</div><div class="cal-weekday">토</div>
          </div>
          <div class="cal-grid" id="adminCalGrid"></div>
          <p class="cal-empty-hint">🟢 이미 등록된 슬롯이 있는 날짜예요</p>
        </div>

        <div class="add-slot-form">
          <div class="field">
            <label>선택한 날짜</label>
            <div class="selected-date-chip" id="selectedDateLabel">날짜를 선택해주세요</div>
          </div>
          <div class="field">
            <label for="n-start">시작 시간</label>
            <input type="time" id="n-start" />
          </div>
          <div class="field">
            <label for="n-end">종료 시간</label>
            <input type="time" id="n-end" />
          </div>
          <button class="btn btn-primary" id="addSlotBtn">슬롯 추가</button>
        </div>
        <div class="status-msg" id="addStatus"></div>
      </div>

      <div class="field" style="margin:20px 0 8px;">
        <label for="filterWho">담당자 필터</label>
        <select id="filterWho">
          <option value="all">전체 보기</option>
          <option value="noah">노아</option>
          <option value="dochi">도치</option>
          <option value="malti">말티</option>
          <option value="soho">소호</option>
          <option value="jay">제이</option>
        </select>
      </div>

      <div class="status-msg" id="deleteStatus"></div>
      <table class="slot-table">
        <thead>
          <tr><th>날짜</th><th>시간</th><th>담당자</th><th>상태</th><th>지원자</th><th>연락처</th><th>포지션</th><th>희망연봉</th><th>이력서</th><th>포트폴리오</th><th></th></tr>
        </thead>
        <tbody id="slotTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://lnvaqdfhsewihveemhbm.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_4X1V0pGecymEpwcSduQjTw_ZCkZTrhK';
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    var TEAM = [
      { key: 'noah', name: '노아' },
      { key: 'dochi', name: '도치' },
      { key: 'malti', name: '말티' },
      { key: 'soho', name: '소호' },
      { key: 'jay', name: '제이' }
    ];
    function nameOf(key) {
      var t = TEAM.find(function (t) { return t.key === key; });
      return t ? t.name : (key || '-');
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function escapeAttr(s) { return esc(s); }

    var allSlots = [];
    var allSlotsByDate = {};
    var calMonth = null;
    var selectedAdminDate = null;
    var currentInterviewer = null;

    function showAdmin() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('whoView').style.display = 'none';
      document.getElementById('adminView').style.display = 'block';
      document.getElementById('whoAmI').textContent = nameOf(currentInterviewer);
      document.getElementById('whoAmI2').textContent = nameOf(currentInterviewer);
      document.getElementById('filterWho').value = currentInterviewer;
      loadAllSlots();
    }
    function showWho() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('adminView').style.display = 'none';
      document.getElementById('whoView').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('whoView').style.display = 'none';
      document.getElementById('adminView').style.display = 'none';
    }

    function chooseWho(key) {
      currentInterviewer = key;
      sessionStorage.setItem('nls_admin_who', key);
      showAdmin();
    }

    document.querySelectorAll('#whoTeam .hero-avatar').forEach(function (el) {
      el.addEventListener('click', function () { chooseWho(el.getAttribute('data-key')); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chooseWho(el.getAttribute('data-key')); }
      });
    });

    document.getElementById('switchWhoBtn').addEventListener('click', showWho);

    document.getElementById('loginBtn').addEventListener('click', async function () {
      var statusEl = document.getElementById('loginStatus');
      statusEl.textContent = '';
      statusEl.className = 'status-msg';
      var email = document.getElementById('a-email').value.trim();
      var password = document.getElementById('a-password').value;
      var { error } = await sb.auth.signInWithPassword({ email: email, password: password });
      if (error) {
        statusEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
        statusEl.classList.add('is-error');
        return;
      }
      showWho();
    });

    document.getElementById('logoutBtn').addEventListener('click', async function () {
      await sb.auth.signOut();
      currentInterviewer = null;
      sessionStorage.removeItem('nls_admin_who');
      showLogin();
    });

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function toKey(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
    function todayKey() { var t = new Date(); return toKey(t.getFullYear(), t.getMonth(), t.getDate()); }
    function fmtTime(t) { return t ? t.slice(0, 5) : ''; }
    function fmtDate(d) {
      var dt = new Date(d + 'T00:00:00');
      return (dt.getMonth() + 1) + '/' + dt.getDate() + ' (' + WEEKDAYS[dt.getDay()] + ')';
    }
    function fmtDateFull(d) {
      var dt = new Date(d + 'T00:00:00');
      return (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + WEEKDAYS[dt.getDay()] + ')';
    }

    async function loadAllSlots() {
      var tbody = document.getElementById('slotTableBody');
      tbody.innerHTML = '<tr><td colspan="11">불러오는 중…</td></tr>';
      var { data, error } = await sb
        .from('interview_slots')
        .select('*')
        .order('slot_date', { ascending: true })
        .order('start_time', { ascending: true });

      if (error) {
        tbody.innerHTML = '<tr><td colspan="11">불러오기 실패</td></tr>';
        return;
      }
      allSlots = data || [];

      if (!calMonth) {
        var base = new Date();
        calMonth = new Date(base.getFullYear(), base.getMonth(), 1);
      }
      renderFiltered();
    }

    function renderFiltered() {
      var filter = document.getElementById('filterWho').value;
      var filtered = filter === 'all' ? allSlots : allSlots.filter(function (s) { return s.interviewer === filter; });

      allSlotsByDate = {};
      filtered.forEach(function (slot) {
        if (!allSlotsByDate[slot.slot_date]) allSlotsByDate[slot.slot_date] = [];
        allSlotsByDate[slot.slot_date].push(slot);
      });
      renderAdminCalendar();

      var tbody = document.getElementById('slotTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11">등록된 슬롯이 없어요.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(function (slot) {
        var badge = slot.is_booked
          ? '<span class="badge badge-booked">예약됨</span>'
          : '<span class="badge badge-open">비어있음</span>';
        var resumeLink = slot.resume_url ? '<a href="' + escapeAttr(slot.resume_url) + '" target="_blank" rel="noopener">보기</a>' : '-';
        var portfolioLink = slot.portfolio_url ? '<a href="' + escapeAttr(slot.portfolio_url) + '" target="_blank" rel="noopener">보기</a>' : '-';
        return '<tr data-id="' + slot.id + '">' +
          '<td>' + fmtDate(slot.slot_date) + '</td>' +
          '<td>' + fmtTime(slot.start_time) + '–' + fmtTime(slot.end_time) + '</td>' +
          '<td>' + nameOf(slot.interviewer) + '</td>' +
          '<td>' + badge + '</td>' +
          '<td>' + esc(slot.candidate_name || '-') + '</td>' +
          '<td>' + esc(slot.candidate_email || slot.candidate_phone || '-') + '</td>' +
          '<td>' + esc(slot.position || '-') + '</td>' +
          '<td>' + esc(slot.desired_salary || '-') + '</td>' +
          '<td>' + resumeLink + '</td>' +
          '<td>' + portfolioLink + '</td>' +
          '<td class="row-actions"><button class="icon-btn" data-action="delete" title="삭제">삭제</button></td>' +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('[data-action="delete"]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var tr = btn.closest('tr');
          var id = tr.getAttribute('data-id');
          var slot = filtered.find(function (s) { return String(s.id) === id; });
          var confirmMsg = slot && slot.is_booked
            ? '⚠️ 이 슬롯은 "' + (slot.candidate_name || '지원자') + '"님이 예약한 슬롯이에요. 정말 삭제할까요? 예약 기록이 완전히 사라집니다.'
            : '이 슬롯을 삭제할까요?';
          if (!confirm(confirmMsg)) return;
          var { error } = await sb.from('interview_slots').delete().eq('id', id);
          var deleteStatusEl = document.getElementById('deleteStatus');
          if (error) {
            if (deleteStatusEl) {
              deleteStatusEl.textContent = '삭제 실패: ' + error.message;
              deleteStatusEl.className = 'status-msg is-error';
            }
            return;
          }
          if (deleteStatusEl) { deleteStatusEl.textContent = ''; deleteStatusEl.className = 'status-msg'; }
          loadAllSlots();
        });
      });
    }

    document.getElementById('filterWho').addEventListener('change', renderFiltered);

    function renderAdminCalendar() {
      var y = calMonth.getFullYear();
      var m = calMonth.getMonth();
      document.getElementById('adminCalTitle').textContent = y + '년 ' + (m + 1) + '월';

      var firstDay = new Date(y, m, 1);
      var startOffset = firstDay.getDay();
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var today = todayKey();

      var html = '';
      for (var i = 0; i < startOffset; i++) {
        html += '<div class="cal-day is-outside"></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var key = toKey(y, m, d);
        var hasSlots = !!allSlotsByDate[key];
        var isPast = key < today;
        var classes = ['cal-day'];
        if (hasSlots) classes.push('has-slots');
        if (key === today) classes.push('is-today');
        if (key === selectedAdminDate) classes.push('is-selected');
        if (isPast) classes.push('is-disabled');
        html += '<div class="' + classes.join(' ') + '" data-date="' + key + '">' + d + '</div>';
      }
      document.getElementById('adminCalGrid').innerHTML = html;

      document.querySelectorAll('#adminCalGrid .cal-day:not(.is-outside):not(.is-disabled)').forEach(function (cell) {
        cell.addEventListener('click', function () {
          selectedAdminDate = cell.getAttribute('data-date');
          var label = document.getElementById('selectedDateLabel');
          label.textContent = fmtDateFull(selectedAdminDate);
          label.classList.add('is-active');
          renderAdminCalendar();
        });
      });
    }

    document.getElementById('adminCalPrev').addEventListener('click', function () {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
      renderAdminCalendar();
    });
    document.getElementById('adminCalNext').addEventListener('click', function () {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
      renderAdminCalendar();
    });

    document.getElementById('addSlotBtn').addEventListener('click', async function () {
      var statusEl = document.getElementById('addStatus');
      statusEl.textContent = '';
      statusEl.className = 'status-msg';
      var start = document.getElementById('n-start').value;
      var end = document.getElementById('n-end').value;
      if (!selectedAdminDate || !start || !end) {
        statusEl.textContent = '날짜를 선택하고 시작/종료 시간을 입력해주세요.';
        statusEl.classList.add('is-error');
        return;
      }
      if (end <= start) {
        statusEl.textContent = '종료 시간은 시작 시간보다 늦어야 해요.';
        statusEl.classList.add('is-error');
        return;
      }
      var isDuplicate = allSlots.some(function (s) {
        return s.slot_date === selectedAdminDate && s.start_time.slice(0, 5) === start && s.interviewer === currentInterviewer;
      });
      if (isDuplicate) {
        statusEl.textContent = '같은 날짜·시간에 이미 등록된 슬롯이 있어요.';
        statusEl.classList.add('is-error');
        return;
      }
      var { error } = await sb.from('interview_slots').insert({ slot_date: selectedAdminDate, start_time: start, end_time: end, interviewer: currentInterviewer });
      if (error) {
        statusEl.textContent = '추가 실패: ' + error.message;
        statusEl.classList.add('is-error');
        return;
      }
      statusEl.textContent = '추가되었습니다. 같은 날짜에 시간을 더 등록할 수 있어요.';
      statusEl.classList.add('is-success');
      document.getElementById('n-start').value = '';
      document.getElementById('n-end').value = '';
      loadAllSlots();
    });

    (async function init() {
      var { data } = await sb.auth.getSession();
      if (data && data.session) {
        var savedWho = sessionStorage.getItem('nls_admin_who');
        if (savedWho) {
          currentInterviewer = savedWho;
          showAdmin();
        } else {
          showWho();
        }
      }
    })();
  </script>

</body>
</html>
